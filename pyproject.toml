[project]
name = "repopilot"
version = "0.1.0"
description = "An autonomous coding agent that clones a GitHub repository, plans changes, applies them, and opens a pull request."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx2>=2.0",
    "ruff>=0.5",
]

[project.scripts]
repopilot = "repopilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/repopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A WebSocket read that blocks forever should fail the test, not hang the suite.
timeout = 60
filterwarnings = ["error::DeprecationWarning:repopilot.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]
